name: wca-live-preview

services:
  database:
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - preview_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
    volumes:
      - ./:/app
      - preview_deps:/app/deps
      - preview_build:/app/_build
      - preview_node_modules:/app/client/node_modules
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4000:4000"
    command:
      - sh
      - -c
      - >-
        mix deps.get &&
        mix ecto.create &&
        mix ecto.migrate &&
        mix run --no-start priv/repo/fto_preview.exs &&
        npm ci --prefix client --no-audit --no-fund &&
        exec mix phx.server

volumes:
  preview_database:
  preview_deps:
  preview_build:
  preview_node_modules:
